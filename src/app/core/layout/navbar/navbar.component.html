<nav class="navbar">
  <div class="navbar-container">
    <div class="navbar-brand">
      <a routerLink="/" class="logo">Relevo</a>
    </div>

    <div class="navbar-search">
      <span class="material-symbols-outlined">search</span>
      <input
        type="text"
        [placeholder]="'NAVBAR.SEARCH_PLACEHOLDER' | translate"
        [ngModel]="searchQuery()"
        (ngModelChange)="onSearchInput($event)"
      />
    </div>

    <div class="navbar-actions">
      <button (click)="themeService.toggleTheme()" class="btn-theme" [title]="(themeService.currentTheme() === 'light' ? 'NAVBAR.DARK_MODE' : 'NAVBAR.LIGHT_MODE') | translate">
        <span class="material-symbols-outlined">
          {{ themeService.currentTheme() === 'light' ? 'dark_mode' : 'light_mode' }}
        </span>
      </button>
      <app-language-selector></app-language-selector>
      @if (authService.isLoggedIn()) {
        <a [routerLink]="getSessionActionRoute()" class="btn-outline">{{ (authService.isAdmin() ? 'NAVBAR.DASHBOARD' : 'NAVBAR.PROFILE') | translate }}</a>
        <button (click)="authService.logout()" class="btn-outline">{{ 'NAVBAR.LOGOUT' | translate }}</button>
      } @else {
        <button routerLink="/register" class="btn-outline">{{ 'NAVBAR.LOGIN_REGISTER' | translate }}</button>
      }
      <button (click)="goToSell()" class="btn-solid">{{ 'NAVBAR.SELL_NOW' | translate }}</button>
    </div>
  </div>
</nav>
