name: CI Pipeline Frontend

on:
  push:
    branches: ['dev']
  pull_request:
    branches: ['dev', 'main']

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ---------------------------------------------------------
  # JOB 1: CALIDAD DE CÓDIGO (Lint, Format, Types)
  # ---------------------------------------------------------
  quality-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate Code (Format, Lint)
        run: npm run validate

      - name: Verify Build
        run: npm run build
